apiVersion: v1
kind: Service
metadata:
  name: {{ include "winenot.fullname" . }}-backend
  labels:
    {{- include "winenot.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
  selector:
    app.kubernetes.io/name: {{ include "winenot.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: backend
