apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "winenot.fullname" . }}-cdn
  labels:
    {{- include "winenot.labels" . | nindent 4 }}
    app.kubernetes.io/component: cdn
spec:
  replicas: {{ .Values.cdn.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "winenot.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: cdn
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "winenot.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: cdn
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: cdn
          image: "{{ .Values.cdn.image.repository }}:{{ .Values.cdn.image.tag }}"
          imagePullPolicy: {{ .Values.cdn.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 5000
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          livenessProbe:
            httpGet:
              path: /status
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /status
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          env:
            - name: NODE_ID
              value: {{ .Values.cdn.env.nodeId | quote }}
            - name: NEIGHBORS
              value: {{ .Values.cdn.env.neighbors | quote }}
          resources:
            {{- toYaml .Values.cdn.resources | nindent 12 }}
