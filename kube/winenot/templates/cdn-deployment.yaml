apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "winenot.fullname" . }}-cdn
  labels:
    {{- include "winenot.labels" . | nindent 4 }}
    app.kubernetes.io/component: cdn
spec:
  replicas: {{ .Values.cdn.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "winenot.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: cdn
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "winenot.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: cdn
    spec:
      containers:
        - name: cdn
          image: "{{ .Values.cdn.image.repository }}:{{ .Values.cdn.image.tag }}"
          imagePullPolicy: {{ .Values.cdn.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: NODE_ID
              value: {{ .Values.cdn.env.nodeId | quote }}
            - name: NEIGHBORS
              value: {{ .Values.cdn.env.neighbors | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
