nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

global:
  timezone: "Europe/Paris"

mysql:
  image:
    repository: mysql
    tag: "9.5"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3306
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  auth:
    user: wine_user
    password: secure_password
    database: wine_cellar
    rootPassword: root_password

backend:
  replicaCount: 1
  image:
    repository: ghcr.io/malaudos35/winenot-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 5000
  # Resource requests/limits for the backend container (tune for your cluster)
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    flaskEnv: development
    apiPathRoot: /api/v1
    minioApiUrl: ""
    playwrightServerUrl: ""
    adminName: Admin
    adminUsername: admin@example.com
    adminPassword: admin

cdn:
  replicaCount: 1
  image:
    repository: ghcr.io/malaudos35/winenot-cdn
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 5000
  # Resource requests/limits for the CDN node
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  env:
    nodeId: node1:5000
    neighbors: ""

playwright:
  replicaCount: 1
  image:
    repository: mcr.microsoft.com/playwright:v1.53.0-noble
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  command:
    - npx
    - playwright
    - run-server
    - --port=3000
    - --host=0.0.0.0

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Ingress configuration (optional)
ingress:
  enabled: true
  className: ""
  # Hostnames to expose the application (set to your domain)
  hosts:
    - host: lvp.ovh
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - lvp.ovh
      secretName: lvp-ovh-tls
  # Add annotations for ingress controller / cert-manager
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    kubernetes.io/ingress.class: "nginx"

# cert-manager settings (creates a Certificate when enabled)
certManager:
  enabled: true
  issuerName: "letsencrypt-prod"
  # secretName used for the Certificate (should match ingress.tls.secretName)
  secretName: lvp-ovh-tls
  # If true, template `Certificate` will be created for hosts defined in ingress.hosts
  createCertificate: true
  # Create ClusterIssuer(s) in the cluster (will create ClusterIssuer resources)
  createClusterIssuer: true
  # Use Let's Encrypt staging server to test (set to false for production)
  useStaging: false
  # Email used for ACME registration
  email: admin@lvp.ovh

# ServiceAccount
serviceAccount:
  create: true
  name: ""

# Horizontal Pod Autoscaler settings for backend and cdn
backend:
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

cdn:
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 50
