nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

global:
  timezone: "Europe/Paris"

mysql:
  image:
    repository: mysql
    tag: "9.5"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3306
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  auth:
    user: wine_user
    password: secure_password
    database: wine_cellar
    rootPassword: root_password

backend:
  replicaCount: 1
  image:
    repository: ghcr.io/malaudos35/winenot-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 5000
  # Resource requests/limits for the backend container (tune for your cluster)
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    flaskEnv: development
    apiPathRoot: /api/v1
    adminName: Admin
    adminUsername: admin@example.com
    adminPassword: admin

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Ingress configuration (optional)
ingress:
  enabled: true
  className: "traefik"
  # Hostnames to expose the application (set to your domain)
  hosts:
  - host: lvp.ovh
    paths:
    - path: /
      pathType: Prefix
  tls:
  - hosts:
    - lvp.ovh
    secretName: lvp-ovh-tls
  # Add annotations for ingress controller / cert-manager
  annotations:
    kubernetes.io/ingress.class: "traefik"

# cert-manager settings (creates a Certificate when enabled)
certManager:
  enabled: true
  issuerName: "letsencrypt-prod"
  # secretName used for the Certificate (should match ingress.tls.secretName)
  secretName: lvp-ovh-tls
  createClusterIssuer: true
  email: lvp.communautee@gmail.com
  createCertificate: true
  useStaging: false

# ServiceAccount
serviceAccount:
  create: true
  name: ""

# Horizontal Pod Autoscaler defaults are provided via ArgoCD Helm values overrides.
