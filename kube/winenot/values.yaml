nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

global:
  timezone: "Europe/Paris"

mysql:
  image:
    repository: mysql
    tag: "9.5"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3306
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  auth:
    user: wine_user
    password: secure_password
    database: wine_cellar
    rootPassword: root_password

backend:
  replicaCount: 1
  image:
    repository: ghcr.io/malaudos35/winenot-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 5000
  env:
    flaskEnv: development
    apiPathRoot: /api/v1
    minioApiUrl: ""
    adminName: Admin
    adminUsername: admin@example.com
    adminPassword: admin

ingress:
  enabled: true
  className: "traefik"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    kubernetes.io/ingress.class: "traefik"
  hosts:
    - host: lvp.ovh
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: lvp-ovh-tls
      hosts:
        - lvp.ovh

frontend:
  enabled: false

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
