name: Pylint Pipeline

# Déclencher le pipeline sur push, PR et manuellement
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret detection with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    runs-on: ubuntu-latest

    steps:
      # Récupérer le code du dépôt
      - name: Checkout code
        uses: actions/checkout@v4

      # Configurer Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            cdn/requirements.txt

      - name: Install les dependances
        run: |
          python -m pip install --upgrade pip
          pip install pylint
          pip install -r backend/requirements.txt
          pip install -r cdn/requirements.txt

      - name: Linter de code Python
        run: make linter

  test-and-build:
    runs-on: ubuntu-latest
    needs: [secret-scan, lint]
    env:
      TZ: UTC
      FLASK_ENV: production
      MYSQL_USER: wine_user
      MYSQL_PASSWORD: secure_password
      MYSQL_DATABASE: wine_cellar
      MYSQL_ROOT_PASSWORD: root_password
      DATABASE_URL: mysql+pymysql://wine_user:secure_password@db:3306/wine_cellar
      ADMIN_NAME: admin@example.com
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin
      API_PATH_ROOT: /api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests
          pip install -r backend/requirements.txt

      - name: Build app images
        run: docker compose build --pull db backend frontend

      - name: Scan app images with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.61.1 image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --no-progress \
            winenot-backend:latest

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.61.1 image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --no-progress \
            winenot-frontend:latest

      - name: Start app services
        run: docker compose up -d db backend

      - name: Wait for API to be ready
        run: |
          echo "Waiting for API on http://localhost:5000/api..."
          for i in {1..60}; do
            if curl -fsS http://localhost:5000/api >/dev/null; then
              echo "API is UP!"
              exit 0
            fi
            echo "Retry ($i/60)..."
            sleep 2
          done
          echo "ERROR: API did not start in time."
          docker compose ps
          docker compose logs db backend
          exit 1

      - name: Run tests Backend
        run: make test_unitaires

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push app images to GHCR
        if: github.event_name != 'pull_request'
        run: |
          OWNER_LC="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          SHA_TAG="${GITHUB_SHA::7}"
          BACKEND_IMAGE="ghcr.io/${OWNER_LC}/winenot-backend"
          FRONTEND_IMAGE="ghcr.io/${OWNER_LC}/winenot-frontend"

          docker tag winenot-backend:latest "${BACKEND_IMAGE}:${SHA_TAG}"
          docker push "${BACKEND_IMAGE}:${SHA_TAG}"

          docker tag winenot-frontend:latest "${FRONTEND_IMAGE}:${SHA_TAG}"
          docker push "${FRONTEND_IMAGE}:${SHA_TAG}"

          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            docker tag winenot-backend:latest "${BACKEND_IMAGE}:latest"
            docker push "${BACKEND_IMAGE}:latest"

            docker tag winenot-frontend:latest "${FRONTEND_IMAGE}:latest"
            docker push "${FRONTEND_IMAGE}:latest"
          fi

      - name: Show docker status on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs db backend

      - name: Docker Compose down
        if: always()
        run: docker compose down --volumes --remove-orphans
